name: Desktop Windows LAB build
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src-mcp/**'
      - 'tools/prepare-desktop.mjs'
      - 'src/production/desktop-bridge.mjs'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          targets: x86_64-pc-windows-msvc
      - name: Build Windows Tauri NSIS candidate
        run: npx --yes @tauri-apps/cli@2.12.2 build
      - name: Inventory installer (no release publication)
        shell: pwsh
        run: |
          $items = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse
          if ($items.Count -lt 1) { throw 'Windows NSIS artifact missing' }
          $items | ForEach-Object { Write-Host $_.FullName; (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
      - uses: actions/upload-artifact@v4
        with:
          name: archviz-desktop-windows-lab
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
