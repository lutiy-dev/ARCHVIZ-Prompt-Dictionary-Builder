name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check src/app.mjs
          node --check src/composer.mjs
          node --check src/translation-ru.mjs
          node --check src/saved-prompts.mjs
          node --check src/prompt-transfer.mjs
      - name: Unit tests
        run: node --test src/*.test.mjs
      - name: JSON validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/prompt_blocks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/dictionary.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/presets.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
