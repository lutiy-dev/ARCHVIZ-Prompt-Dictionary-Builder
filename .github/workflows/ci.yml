name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check src/app.mjs
          node --check src/composer.mjs
          node --check src/translation-ru.mjs
          node --check src/saved-prompts.mjs
          node --check src/prompt-transfer.mjs
          node --check sw.js
          node --check src/video-director/schema.mjs
          node --check src/video-director/compiler.mjs
          node --check src/video-director/layer-presets.mjs
          node --check src/video-director/store.mjs
          node --check src/video-director/ui.mjs
          node --check src/video-director/mode-tabs.mjs
          node --check src/production/core.mjs
          node --check src/production/ui.mjs
          node --check src/production/comfyui-adapter.mjs
          node --check src/production/skills-router.mjs
          node --check src/production/openai-adapter.mjs
          node --check src/production/art-direction-format.mjs
          node --check src/production/candidate-review.mjs
          node --check src/production/history-store.mjs
          node --check src/production/mcp-sidecar.mjs
          node --check tools/desktop-lab.mjs
          node --check src/production/image-qc.mjs
          node --check src/production/desktop-bridge.mjs
          node --check src/production/comfyui-execution.mjs
          node --check src/production/edge-qc.mjs
          node --check tools/prepare-desktop.mjs
          node --check tools/test-native-mcp.mjs
      - name: Unit tests
        run: node --test src/*.test.mjs src/video-director/*.test.mjs src/production/*.test.mjs
      - name: Verify static Desktop asset assembly
        run: node tools/prepare-desktop.mjs --assets-only
      - name: Desktop LAB subprocess and HTTP integration
        run: node --test tools/desktop-lab.test.mjs
      - name: Real Chromium browser and PWA smoke
        run: node tools/test-video-director-browser.mjs
