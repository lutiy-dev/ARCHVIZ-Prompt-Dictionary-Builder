[package]
name = "ovizlab-prompt-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
build = "build.rs"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-shell = "=2.5.0"
serde_json = "1"

[[bin]]
name = "ovizlab-prompt-studio"
path = "src/main.rs"

[[bin]]
name = "ovizlab-mcp"
path = "src/bin/ovizlab-mcp.rs"
